      return resp === 'N/A' && ehAtiva(p.etapa)
    })
  } else if (filtroColab === 'TODOS') {
    // Exige responsável apenas das ATIVAS. Finalizadas (concedido/recusado/excluído)
    // são histórico e não precisam de responsável para aparecer.
    rows = rows.filter(p => {
      if (ehFinalizada(p.etapa)) return true
      return (p.responsavel||'N/A').toUpperCase().trim() !== 'N/A'
    })
  } else {
    rows = rows.filter(p => (p.responsavel||'N/A').toUpperCase().trim() === filtroColab)
  }
  rows = aplicarFiltrosData(rows)
  // Esconde finalizadas (Concedido/Recusado/Excluído) do fluxo do dia a dia,
  // exceto quando: o botão "Mostrar finalizadas" está ativo, o usuário
  // filtrou explicitamente por uma etapa finalizada, OU há uma busca textual ativa
  // (a busca deve encontrar qualquer proposta, inclusive finalizadas).
  const filtrouEtapaFinalizada = filtroEtapa && ehFinalizada(filtroEtapa)
  const temBusca = filtroSearch.trim().length > 0
  if (!mostrarFinalizadas && !filtrouEtapaFinalizada && !temBusca) {
    rows = rows.filter(p => ehAtiva(p.etapa))
  }
  return rows
}

// Retorna as linhas exatamente como exibidas na tabela (com busca e ordenação)
function getLinhasVisiveis() {
  let rows = getLinhasFiltradas()
  if (filtroSearch.trim()) {
    const q = filtroSearch.toLowerCase()
    rows = rows.filter(p =>
      String(p.codigo||'').toLowerCase().includes(q) ||
      (p.etapa||'').toLowerCase().includes(q) ||
      (p.razao_social||'').toLowerCase().includes(q)
    )
  }
  rows.sort((a,b) => {
    let va = a[sortCol] ?? '', vb = b[sortCol] ?? ''
    if (typeof va === 'number' && typeof vb === 'number') return (va-vb)*sortDir
    return String(va).localeCompare(String(vb), 'pt-BR') * sortDir
  })
  return rows
}

// ── Controle dos filtros avançados ──
function toggleFiltrosAvancados() {
  const el = document.getElementById('filtros-avancados')
  el.classList.toggle('aberto')
}

// ── Mostrar / esconder propostas finalizadas ──
async function toggleFinalizadas() {
  mostrarFinalizadas = !mostrarFinalizadas
  pagAtual = 1
  const btn = document.getElementById('btn-finalizadas')
  const lbl = document.getElementById('lbl-finalizadas')

  // Primeira vez que liga: busca o histórico no banco
  if (mostrarFinalizadas && !finalizadasCarregadas) {
    lbl.textContent = '⏳ Carregando histórico...'
    btn.disabled = true
    try {
      const fin = await sbAll('propostas?select=*&finalizada=eq.true&order=codigo.asc')
      const jaTem = new Set(todasPropostas.map(p => String(p.codigo)))
      todasPropostas = todasPropostas.concat((fin||[]).filter(p => !jaTem.has(String(p.codigo))))
      finalizadasCarregadas = true
      popularSelectEtapas()
      showToast(`✓ ${(fin||[]).length} propostas finalizadas carregadas`)
    } catch(e) {
      showToast('Erro ao carregar histórico: ' + e.message, 'error')
      mostrarFinalizadas = false
    }
    btn.disabled = false
  }

  if (mostrarFinalizadas) {
    lbl.textContent = '🙈 Esconder finalizadas'
    btn.style.background = '#003366'
    btn.style.color = '#fff'
    btn.style.borderColor = '#003366'
  } else {
    lbl.textContent = '👁 Mostrar finalizadas'
    btn.style.background = ''
    btn.style.color = ''
    btn.style.borderColor = ''
  }
  renderTabelaPropostas()
  renderStatsPropostas()
}

function contarFiltrosAtivos() {
  let n = 0
  if (filtroDataIni) n++
  if (filtroDataFim) n++
  if (filtroValorMin !== '') n++
  if (filtroValorMax !== '') n++
  if (filtroEtapa) n++
  if (filtroLinhaCredito) n++
  return n
}

// Gera as opções de etapa a partir das propostas carregadas, ordenadas pelo funil
// Preenche o select de etapas depois que as propostas foram carregadas.
// Necessario porque o HTML do filtro e montado no INIT, antes dos dados chegarem.
function popularSelectEtapas() {
  const sel = document.getElementById('fa-etapa')
  if (!sel) return
  const atual = filtroEtapa
  sel.innerHTML = '<option value="">Todas as etapas</option>' + opcoesEtapas()
  sel.value = atual || ''
}

function opcoesEtapas() {
  const etapasSet = new Set()
  todasPropostas.forEach(p => { const e = (p.etapa||'').trim(); if (e) etapasSet.add(e) })
  const etapas = [...etapasSet].sort((a,b) => {
    const pa = posicaoFunil(a), pb = posicaoFunil(b)
    if (pa === -1 && pb === -1) return a.localeCompare(b,'pt-BR')
    if (pa === -1) return 1
    if (pb === -1) return -1
    return pa - pb
  })
  return etapas.map(e => `<option value="${e}" ${filtroEtapa===e?'selected':''}>${e}</option>`).join('')
}

function atualizarBadgeFiltros() {

  if (!badge) return

  badge.innerHTML = n > 0 ? `<span class="filtro-badge-count">${n}</span>` : ''

  filtroEtapa = ''; filtroLinhaCredito = ''

function valorNum(p) {
  let n
  if (typeof p.valor === 'number') n = p.valor
  else n = parseFloat(String(p.valor||'0').replace(/[^0-9.,]/g,'').replace(/\.(?=\d{3})/g,'').replace(',','.'))
  if (isNaN(n)) return 0
  return corrigirValor(n)
}

// Texto da última atualização da planilha, com destaque se estiver antiga
function textoUltimaAtualizacao() {
  if (!ultimaAtualizacao) return '<span class="ultima-atu sem">Sem processamento registrado</span>'
  const d = new Date(ultimaAtualizacao)
  const quando = d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' })
  const dias = diasParados(d.toISOString().split('T')[0])
  const atrasada = dias !== null && dias >= 2
  const rel = dias === 0 ? 'hoje' : dias === 1 ? 'ontem' : `há ${dias} dias`
  return `<span class="ultima-atu ${atrasada ? 'alerta' : ''}" title="Data e hora do último processamento de planilha">
    ${atrasada ? '⚠️' : '🕒'} Atualizado ${rel} · ${quando}
  </span>`
}

function renderStatsPropostas() {
  const el = document.getElementById('dashboard-propostas')
  if (!el) return

  const linhas = getLinhasFiltradas()

  // Contexto do filtro
  let ctx = []
  if (filtroColab === 'NOVAS') ctx.push('Propostas novas')
  else if (filtroColab === 'N/A') ctx.push('Sem responsável')
  else if (filtroColab !== 'TODOS') ctx.push(filtroColab)
  else ctx.push('Todos os responsáveis')
  if (filtroEtapa) ctx.push(filtroEtapa)
  if (filtroLinhaCredito) ctx.push(filtroLinhaCredito)
  const contexto = ctx.join(' · ')

  // Métricas
  const total = linhas.length
  const ativas = linhas.filter(p => ehAtiva(p.etapa))
  const totalAtivas = ativas.length
  const valorAtivo = ativas.reduce((s,p) => s + valorNum(p), 0)
  const valorTotal = linhas.reduce((s,p) => s + valorNum(p), 0)
  const concedidas = linhas.filter(p => (p.etapa||'').toLowerCase().trim() === 'concedido').length
  // Recusado + Excluído somados (100% juntos)
  const naoConcedidas = linhas.filter(p => {
    const e = (p.etapa||'').toLowerCase().trim()
    return e === 'recusado' || e === 'excluído' || e === 'excluido'
  }).length

  // Propostas ativas paradas há 15+ dias
  const paradasList = ativas.filter(p => {
    const d = diasParados(p.na_etapa_desde)
    return d !== null && d >= DIAS_LIMITE_PARADA
  })
  const paradas = paradasList.length

  // Média de dias parados (só ativas com data válida)
  const diasArr = ativas.map(p => diasParados(p.na_etapa_desde)).filter(d => d !== null)
  const mediaDias = diasArr.length ? Math.round(diasArr.reduce((s,d) => s+d, 0) / diasArr.length) : 0

  // Cards — sempre acompanham os filtros ativos
  const ehGeral = (filtroColab === 'TODOS' || filtroColab === 'N/A' || filtroColab === 'NOVAS')
  const rotuloTotal = ehGeral ? 'Total de Propostas' : `Propostas de ${filtroColab}`

  let cards = `
    <div class="dash-card accent-azul"><div class="dash-label">${rotuloTotal}</div><div class="dash-value">${total}</div></div>
    <div class="dash-card accent-verde"><div class="dash-label">Ativas</div><div class="dash-value">${totalAtivas}</div><div class="dash-sub">em tratativa</div></div>
    <div class="dash-card accent-dourado"><div class="dash-label">Valor em Tratativa<span class="ajuda ajuda-baixo" data-ajuda="Soma do valor apenas das propostas ATIVAS (em andamento). Não inclui Concedido, Recusado nem Excluído.">?</span></div><div class="dash-value" style="font-size:19px">${formatValor(valorAtivo)}</div><div class="dash-sub">só propostas ativas</div></div>
    <div class="dash-card accent-roxo"><div class="dash-label">Valor Total<span class="ajuda ajuda-baixo" data-ajuda="Soma do valor de TODAS as propostas do filtro atual, incluindo as já finalizadas.">?</span></div><div class="dash-value" style="font-size:19px">${formatValor(valorTotal)}</div><div class="dash-sub">todas as propostas</div></div>
    <div class="dash-card accent-parada"><div class="dash-label">⚠️ Paradas 15+ dias<span class="ajuda ajuda-baixo" data-ajuda="Propostas ativas que estão há 15 dias ou mais na mesma etapa sem avançar. Só conta propostas em andamento.">?</span></div><div class="dash-value" style="color:${paradas>0?'#dc2626':'#16a34a'}">${paradas}</div><div class="dash-sub">propostas ativas</div></div>
    <div class="dash-card accent-cinza"><div class="dash-label">Média de Dias Parados<span class="ajuda ajuda-baixo ajuda-esq" data-ajuda="Média de quantos dias as propostas ativas estão paradas na etapa atual. Ajuda a medir a velocidade de andamento.">?</span></div><div class="dash-value">${mediaDias}<span style="font-size:14px;font-weight:600;color:#9ca3af"> dias</span></div><div class="dash-sub">média das ativas na etapa</div></div>`

  el.innerHTML = `
    <div class="dash-header">
      <div class="dash-title">📈 Painel de Indicadores</div>
      <div style="display:flex;align-items:center;gap:10px;margin-left:auto">
        ${textoUltimaAtualizacao()}
        <div class="dash-context">${contexto}</div>
      </div>
    </div>
    <div class="dash-grid">${cards}</div>`
}

function setFiltroColab(c) {
  filtroColab = c
  pagAtual = 1
  document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'))
  const btn = document.getElementById(`filtro-${c}`)
  if (btn) {
    btn.classList.add('active')
    if (c === 'NOVAS') btn.style.borderColor = '#003366'
  }
  renderTabelaPropostas()
  renderStatsPropostas()

}

let buscaTimer = null
function setSearch(v) {
  filtroSearch = v
  pagAtual = 1
  renderTabelaPropostas()
  atualizarBadgeFiltros()
  // Se digitou um código e ele não está na memória, procura no banco.
  // Assim a busca alcança o histórico inteiro sem precisar carregá-lo.
  clearTimeout(buscaTimer)
  buscaTimer = setTimeout(() => buscarNoBanco(v), 450)
}

async function buscarNoBanco(termo) {
  const q = (termo||'').trim()
  if (q.length < 4 || finalizadasCarregadas) return          // curto demais ou já temos tudo
  if (todasPropostas.some(p => String(p.codigo).includes(q))) return  // já achou localmente
  try {
    const achadas = await sbAll(`propostas?select=*&codigo=like.*${encodeURIComponent(q)}*`)
    if (!achadas || !achadas.length) return
    const jaTem = new Set(todasPropostas.map(p => String(p.codigo)))
    const novas = achadas.filter(p => !jaTem.has(String(p.codigo)))
    if (!novas.length) return
    todasPropostas = todasPropostas.concat(novas)
    renderTabelaPropostas()
    renderStatsPropostas()
    showToast(`✓ ${novas.length} proposta${novas.length>1?'s':''} encontrada${novas.length>1?'s':''} no histórico`)
  } catch(e) { /* silencioso: a busca local continua valendo */ }
}

function setSort(col) {
  if (sortCol === col) sortDir *= -1
  else { sortCol = col; sortDir = 1 }
  pagAtual = 1
  renderTabelaPropostas()
}

function renderTabelaPropostas() {
  const todasRows = getLinhasVisiveis()

  const cols = [
    {key:'responsavel', label:'Responsável'},
    {key:'codigo', label:'Código da Operação'},
    {key:'razao_social', label:'Razão Social', ajuda:'Nome da empresa ou do cliente, sem os numeros do documento. O CNPJ nao e guardado pelo sistema.'},
    {key:'linha_credito', label:'Linha'},
    {key:'etapa', label:'Etapa'},
    {key:'valor', label:'Valor', align:'right'},
    {key:'na_etapa_desde', label:'Na Etapa Desde', ajuda:'Data em que a proposta entrou na etapa atual. O icone de alerta e os dias entre parenteses mostram ha quanto tempo esta parada.'},
    {key:'observacao', label:'Observação'},
  ]

  if (!todasRows.length) {
    document.getElementById('tabela-propostas').innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>Nenhuma proposta encontrada.</p></div>`
    renderBarraLote()
    return
  }

  // ── Paginação ──
  const totalPags = Math.max(1, Math.ceil(todasRows.length / pagTamanho))
  if (pagAtual > totalPags) pagAtual = totalPags
  if (pagAtual < 1) pagAtual = 1
  const ini = (pagAtual - 1) * pagTamanho
  const rows = todasRows.slice(ini, ini + pagTamanho)

  // Códigos visíveis na página (para o "selecionar todos")
  const codigosPagina = rows.map(p => String(p.codigo))
  const todosSelecionados = codigosPagina.length > 0 && codigosPagina.every(c => selecionadas.has(c))

  const th = `<th class="check-col"><input type="checkbox" class="row-check" ${todosSelecionados?'checked':''} onclick="toggleSelecionarPagina(this.checked)" title="Selecionar todos desta página"/></th>` +
    cols.map(c => {
      const isSorted = sortCol === c.key
      const icon = isSorted ? (sortDir===1?'↑':'↓') : '↕'
      const tip = c.ajuda ? `<span class="ajuda ajuda-baixo ajuda-esq" data-ajuda="${c.ajuda}" onclick="event.stopPropagation()">?</span>` : ''
      return `<th class="${isSorted?'sorted':''}" onclick="setSort('${c.key}')" style="${c.align?'text-align:'+c.align:''}">
        ${c.label}${tip} <span class="sort-icon">${icon}</span>
      </th>`
    }).join('')

  const trs = rows.map(p => {
    const resp = p.responsavel || 'N/A'
    const bg = getCorColab(resp)
    const fg = getTextColor(bg)
    const iniciais = getIniciais(resp)

    const respCell = resp === 'N/A'
      ? `<td><div class="resp-cell"><span class="resp-tarja" style="background:#cbd5e1"></span>
           <div class="dd-trigger" onclick="abrirDropdown(this, '${p.codigo}', 'N/A')">👤 Atribuir</div>
         </div></td>`
      : `<td><div class="resp-cell">
           <span class="resp-tarja" style="background:${bg}"></span>
           <span class="resp-avatar" style="background:${bg};color:${fg}">${iniciais}</span>
           <span class="resp-nome">${resp}</span>
           <button class="btn-trocar-v2" title="Trocar responsável" onclick="abrirDropdown(this, '${p.codigo}', '${resp}')">✎</button>
         </div></td>`

    const obs = p.observacao || ''
    const obsCell = obs
      ? `<td><button class="btn btn-secondary btn-sm" onclick="abrirModal('${p.codigo}','${(obs).replace(/'/g,"\\'")}','${(p.observacoes_anteriores||'').replace(/'/g,"\\'")}')">
           <span class="obs-indicator"><span class="obs-dot"></span>✏ Ver/Editar</span>
         </button></td>`
      : `<td><button class="btn btn-secondary btn-sm" style="color:#9ca3af" onclick="abrirModal('${p.codigo}','','${(p.observacoes_anteriores||'').replace(/'/g,"\\'")}')">
           + Adicionar
         </button></td>`

    const etapasFin = ['concedido','excluído','excluido','recusado']
    const ehAtiva = !etapasFin.includes((p.etapa||'').toLowerCase().trim())
    const dias = diasParados(p.na_etapa_desde)
    const paradaClass = (ehAtiva && dias !== null && dias >= DIAS_LIMITE_PARADA) ? ' class="linha-parada"' : ''

    const estaSel = selecionadas.has(String(p.codigo))
    const classes = [paradaClass.replace(' class="','').replace('"',''), estaSel ? 'selecionada' : ''].filter(Boolean).join(' ')
    const trClass = classes ? ` class="${classes}"` : ''

    return `<tr${trClass} data-codigo="${p.codigo}">
      <td class="check-col"><input type="checkbox" class="row-check" ${estaSel?'checked':''} onclick="toggleSelecionada('${p.codigo}', this.checked)"/></td>
      ${respCell}
      <td class="td-cnpj" style="font-weight:700">${p.codigo||'—'}</td>
      <td class="td-razao" title="${(p.razao_social||'').replace(/"/g,'&quot;')}">${p.razao_social || '<span style="color:#cbd5e1">—</span>'}</td>
      <td>${linhaBadge(p.linha_credito)}</td>
      <td class="td-etapa">${etapaBadge(p.etapa)}</td>
      <td class="td-valor">${formatValor(p.valor)}</td>
      ${celulaData(p)}
      ${obsCell}
    </tr>`
  }).join('')

  const fim = Math.min(ini + pagTamanho, todasRows.length)

  document.getElementById('tabela-propostas').innerHTML = `
    <div id="lote-bar-container"></div>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">${todasRows.length} proposta${todasRows.length!==1?'s':''} encontrada${todasRows.length!==1?'s':''}</div>
    <div class="table-wrap">
      <table>
        <thead><tr>${th}</tr></thead>
        <tbody>${trs}</tbody>
      </table>
    </div>
    ${renderPaginacao(todasRows.length, ini+1, fim, totalPags)}`

  renderBarraLote()
}

// ── Paginação ──
function renderPaginacao(total, de, ate, totalPags) {
  if (total <= pagTamanho && pagTamanho !== 0) {
    return `<div class="pag-wrap">
      <div class="pag-info">Mostrando <b>${total}</b> proposta${total!==1?'s':''}</div>
      <div class="pag-ctrl">
        <span style="font-size:12px;color:var(--text-muted);margin-right:6px">Por página:</span>
        <select class="pag-size" onchange="setPagTamanho(this.value)">
          ${[25,50,100,200].map(n => `<option value="${n}" ${pagTamanho===n?'selected':''}>${n}</option>`).join('')}
          <option value="0" ${pagTamanho===0?'selected':''}>Todas</option>
        </select>
      </div>
    </div>`
  }

  // Botões de página (com reticências quando há muitas)
  let botoes = ''
  const janela = 2
  const pages = []
  for (let i = 1; i <= totalPags; i++) {
    if (i === 1 || i === totalPags || (i >= pagAtual-janela && i <= pagAtual+janela)) pages.push(i)
    else if (pages[pages.length-1] !== '...') pages.push('...')
  }
  botoes = pages.map(p =>
    p === '...' ? `<span class="pag-dots">···</span>`
    : `<button class="pag-btn ${p===pagAtual?'ativo':''}" onclick="irPagina(${p})">${p}</button>`
  ).join('')

  return `<div class="pag-wrap">
    <div class="pag-info">Mostrando <b>${de}–${ate}</b> de <b>${total}</b> propostas</div>
    <div class="pag-ctrl">
      <button class="pag-btn" onclick="irPagina(${pagAtual-1})" ${pagAtual<=1?'disabled':''}>‹</button>
      ${botoes}
      <button class="pag-btn" onclick="irPagina(${pagAtual+1})" ${pagAtual>=totalPags?'disabled':''}>›</button>
      <select class="pag-size" style="margin-left:8px" onchange="setPagTamanho(this.value)">
        ${[25,50,100,200].map(n => `<option value="${n}" ${pagTamanho===n?'selected':''}>${n}/pág</option>`).join('')}
        <option value="0" ${pagTamanho===0?'selected':''}>Todas</option>
      </select>
    </div>
  </div>`
}

function irPagina(n) {
  pagAtual = n
  renderTabelaPropostas()
  document.querySelector('.table-wrap')?.scrollTo({ top: 0, behavior: 'smooth' })
}

function setPagTamanho(v) {
  const n = Number(v)
  pagTamanho = n === 0 ? 999999 : n
  pagAtual = 1
  renderTabelaPropostas()
}

let dropdownAberto = null
let modalRespCodigo = null
let modalRespLote = false

function fecharDropdown() {
  if (dropdownAberto) {
    dropdownAberto.remove()
    dropdownAberto = null
    document.removeEventListener('click', handlerFecharFora, true)
  }
}

function handlerFecharFora(e) {
  if (dropdownAberto && !dropdownAberto.contains(e.target) && !e.target.closest('.dd-trigger') && !e.target.closest('.btn-trocar-v2')) {
    fecharDropdown()
  }
}

// ── Modal de seleção de responsável (substitui o dropdown inline) ──
function abrirDropdown(anchor, codigo, respAtual) {
  modalRespCodigo = String(codigo)
  modalRespLote = false
  const p = todasPropostas.find(x => String(x.codigo) === String(codigo))
  document.getElementById('mr-titulo').textContent = respAtual === 'N/A' ? 'Atribuir responsável' : 'Trocar responsável'
  document.getElementById('mr-sub').innerHTML = `Proposta <b>${codigo}</b>${p && p.etapa ? ' · ' + p.etapa : ''}`
  montarGridResp(respAtual)
  abrirModalRespUI()
}

function abrirModalRespUI() {

  document.getElementById('mr-vazio').style.display = 'none'

// Filtra os colaboradores conforme a digitação
function filtrarModalResp(termo) {
  const q = (termo || '').toLowerCase().trim()
  const opts = document.querySelectorAll('#mr-grid .mr-opt')
  let visiveis = 0
  opts.forEach(o => {
    const nome = (o.dataset.nome || '').toLowerCase()
    const bate = !q || nome.includes(q)

    if (bate) visiveis++
  })

function abrirModalRespLote() {
  fecharDropdown()

  if (!n) return
  modalRespCodigo = null
  modalRespLote = true
  document.getElementById('mr-titulo').textContent = 'Reatribuir em lote'
  document.getElementById('mr-sub').innerHTML = `<b>${n}</b> proposta${n!==1?'s':''} selecionada${n!==1?'s':''}`

  abrirModalRespUI()
}

function montarGridResp(respAtual) {
  document.getElementById('mr-grid').innerHTML = COLAB_LIST.filter(c => c !== 'N/A').map(c => {
    const cor = getCorColab(c)
    const fgC = getTextColor(cor)
    const ehAtual = c === respAtual
    return `<div class="mr-opt ${ehAtual?'atual':''}" data-nome="${c}" onclick="escolherResp('${c.replace(/'/g,"\\'")}')">
      <span class="mr-opt-avatar" style="background:${cor};color:${fgC}">${getIniciais(c)}</span>
      <span class="mr-opt-nome">${c}</span>
      ${ehAtual ? '<span class="mr-opt-check">✓</span>' : ''}
    </div>`

}

function fecharModalResp(e) {
  if (e && e.target !== document.getElementById('modal-resp')) return
  document.getElementById('modal-resp').style.display = 'none'
  modalRespCodigo = null
  modalRespLote = false
}

async function escolherResp(novo) {
  const emLote = modalRespLote
  const codigo = modalRespCodigo
  document.getElementById('modal-resp').style.display = 'none'
  modalRespCodigo = null
  modalRespLote = false

  if (emLote) { await reatribuirLote(novo); return }
  const atual = todasPropostas.find(p => String(p.codigo) === String(codigo))
  if (atual && atual.responsavel === novo) return
  await atribuirResponsavel(codigo, novo, null)
}

async function atribuirResponsavel(codigo, resp, selectEl) {
  if (!resp) return
  try {
    // 1. Salva na tabela propostas
    await sb(`propostas?codigo=eq.${encodeURIComponent(codigo)}`, {
      method: 'PATCH',
      prefer: 'return=minimal',
      body: { responsavel: resp, responsavel_final: resp }
    })

    // 2. Atualiza a planilha_referencia mais recente para persistir entre reprocessamentos
    const refs = await sb('planilha_referencia?select=id,dados&order=criado_em.desc&limit=1')
    if (refs && refs[0]) {
      const refId = refs[0].id
      const dados = refs[0].dados || []
      const idx2 = dados.findIndex(r => String(r.codigo).trim() === String(codigo).trim())
      if (idx2 !== -1) {
        dados[idx2].responsavel_final = resp
      } else {
        dados.push({ codigo: String(codigo).trim(), responsavel_final: resp, observacao: '' })
      }
      await sb(`planilha_referencia?id=eq.${refId}`, {
        method: 'PATCH',
        prefer: 'return=minimal',
        body: { dados }
      })
    }

    const idx = todasPropostas.findIndex(p => p.codigo === codigo)
    if (idx !== -1) { todasPropostas[idx].responsavel = resp; todasPropostas[idx].responsavel_final = resp }
    showToast(`✓ ${resp} atribuído e salvo`)
    renderTabelaPropostas()
    renderStatsPropostas()
    // Destaca a linha recém-salva
    setTimeout(() => {
      const tr = document.querySelector(`tr[data-codigo="${codigo}"]`)
      if (tr) tr.classList.add('linha-salva')
    }, 50)
  } catch(e) {
    showToast('Erro ao atribuir: ' + e.message, 'error')
  }
}

function abrirModal(codigo, obs, obsAntiga) {
  modalCodigo = codigo
  document.getElementById('modal-title').textContent = 'Observação'
  document.getElementById('modal-info').textContent = `Código da Operação: ${codigo}`
  document.getElementById('modal-textarea').value = obs || ''
  document.getElementById('modal-obs').style.display = 'flex'
  carregarHistoricoObs(codigo, obsAntiga)
}

// Busca as versões anteriores da observação desta proposta
async function carregarHistoricoObs(codigo, obsAntigaLegado) {
  const el = document.getElementById('modal-obs-hist')
  el.innerHTML = '<span class="obs-hist-vazio">⏳ Carregando...</span>'
  try {
    const hist = await sb(`observacoes_historico?select=texto,criado_em&codigo=eq.${encodeURIComponent(codigo)}&order=criado_em.desc&limit=30`)
    if (hist && hist.length) {
      el.innerHTML = hist.map(h => {
        const d = h.criado_em ? new Date(h.criado_em).toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : ''
        return `<div class="obs-hist-item"><span class="obs-hist-data">${d}</span>${h.texto}</div>`
      }).join('')
      return
    }
  } catch(e) { /* tabela ainda não criada: cai no modo antigo */ }
  // Sem histórico: mostra a observação anterior que já estava gravada
  el.innerHTML = obsAntigaLegado
    ? `<div class="obs-hist-item"><span class="obs-hist-data">registro anterior</span>${obsAntigaLegado}</div>`
    : '<span class="obs-hist-vazio">Nenhuma observação anterior</span>'
}

function fecharModal(e) {
  if (e && e.target !== document.getElementById('modal-obs')) return
  document.getElementById('modal-obs').style.display = 'none'
  modalCodigo = null
}

async function salvarObservacao() {
  if (!modalCodigo) return
  const obs = document.getElementById('modal-textarea').value.trim()
  const btn = document.getElementById('btn-salvar-obs')
  btn.disabled = true; btn.textContent = 'Salvando...'
  try {
    // Antes de trocar, guarda a versão que está saindo
    const idx = todasPropostas.findIndex(p => p.codigo === modalCodigo)
    const anterior = idx !== -1 ? (todasPropostas[idx].observacao || '').trim() : ''
    if (anterior && anterior !== obs) {
      try {
        await sb('observacoes_historico', {
          method: 'POST', prefer: 'return=minimal',
          body: { codigo: modalCodigo, texto: anterior }
        })
      } catch(e) { /* se a tabela não existir, segue e salva assim mesmo */ }
    }
    await sb(`propostas?codigo=eq.${encodeURIComponent(modalCodigo)}`, {
      method: 'PATCH',
      prefer: 'return=minimal',
      body: { observacao: obs }
    })
    if (idx !== -1) todasPropostas[idx].observacao = obs
    document.getElementById('modal-obs').style.display = 'none'
    modalCodigo = null
    showToast('Observação salva!')
    renderTabelaPropostas()
  } catch(e) {
    showToast('Erro ao salvar: ' + e.message, 'error')
  } finally {
    btn.disabled = false; btn.textContent = 'Salvar'
  }
}

function toggleSelecionada(codigo, marcado) {
  const c = String(codigo)
  if (marcado) selecionadas.add(c)
  else selecionadas.delete(c)
  const tr = document.querySelector(`tr[data-codigo="${c}"]`)
  if (tr) tr.classList.toggle('selecionada', marcado)
  renderBarraLote()
}

function toggleSelecionarPagina(marcado) {
  const todasRows = getLinhasVisiveis()
  const ini = (pagAtual - 1) * pagTamanho
  const rows = todasRows.slice(ini, ini + pagTamanho)
  rows.forEach(p => {
    const c = String(p.codigo)
    if (marcado) selecionadas.add(c)
    else selecionadas.delete(c)
  })
  renderTabelaPropostas()
}

function limparSelecao() {
  selecionadas.clear()
  renderTabelaPropostas()
}

function selecionarTodosFiltrados() {
  getLinhasVisiveis().forEach(p => selecionadas.add(String(p.codigo)))
  renderTabelaPropostas()
  showToast(`${selecionadas.size} propostas selecionadas`)
}

function renderBarraLote() {
  const cont = document.getElementById('lote-bar-container')
  if (!cont) return
  const n = selecionadas.size
  if (n === 0) { cont.innerHTML = ''; return }

  const totalFiltrado = getLinhasVisiveis().length
  cont.innerHTML = `
    <div class="lote-bar ativo">
      <span class="lote-count">${n} selecionada${n!==1?'s':''} <small>de ${totalFiltrado} filtradas</small></span>
      <div class="lote-acoes">
        ${n < totalFiltrado ? `<button class="btn-lote" onclick="selecionarTodosFiltrados()">Selecionar todas as ${totalFiltrado}</button>` : ''}
        <button class="btn-lote primario" onclick="abrirModalRespLote()">👤 Reatribuir para...</button>
        <button class="btn-lote" onclick="limparSelecao()">✕ Limpar</button>
      </div>
    </div>`
}

async function reatribuirLote(novoResp) {
  const codigos = [...selecionadas]
  if (!codigos.length) return

  if (!confirm(`Reatribuir ${codigos.length} proposta${codigos.length!==1?'s':''} para ${novoResp}?`)) return

  const cont = document.getElementById('lote-bar-container')
  if (cont) cont.innerHTML = `<div class="lote-bar ativo"><span class="lote-count"><span class="spinner"></span> Reatribuindo 0/${codigos.length}...</span></div>`

  let ok = 0, erros = 0
  try {
    // 1. Atualiza cada proposta no banco
    for (const codigo of codigos) {
      try {
        await sb(`propostas?codigo=eq.${encodeURIComponent(codigo)}`, {
          method: 'PATCH', prefer: 'return=minimal',
          body: { responsavel: novoResp, responsavel_final: novoResp }
        })
        const idx = todasPropostas.findIndex(p => String(p.codigo) === String(codigo))
        if (idx !== -1) { todasPropostas[idx].responsavel = novoResp; todasPropostas[idx].responsavel_final = novoResp }
        ok++
        if (cont && ok % 3 === 0) cont.innerHTML = `<div class="lote-bar ativo"><span class="lote-count"><span class="spinner"></span> Reatribuindo ${ok}/${codigos.length}...</span></div>`
      } catch(e) { erros++ }
    }

    // 2. Atualiza a referência (uma única vez, com todos os códigos)
    const refs = await sb('planilha_referencia?select=id,dados&order=criado_em.desc&limit=1')
    if (refs && refs[0]) {
      const refId = refs[0].id
      const dados = refs[0].dados || []
      codigos.forEach(codigo => {
        const i = dados.findIndex(r => String(r.codigo).trim() === String(codigo).trim())
        if (i !== -1) dados[i].responsavel_final = novoResp
        else dados.push({ codigo: String(codigo).trim(), responsavel_final: novoResp, observacao: '' })
      })
      await sb(`planilha_referencia?id=eq.${refId}`, {
        method: 'PATCH', prefer: 'return=minimal', body: { dados }
      })
    }

    selecionadas.clear()
    renderTabelaPropostas()
    renderStatsPropostas()
    showToast(erros ? `✓ ${ok} reatribuídas, ${erros} com erro` : `✓ ${ok} propostas reatribuídas para ${novoResp}`, erros ? 'error' : 'success')
  } catch(e) {
    showToast('Erro ao reatribuir: ' + e.message, 'error')
    renderTabelaPropostas()
  }
}

function nomeContextoFiltro() {
  if (filtroColab === 'TODOS') return 'Todos os responsaveis'
  if (filtroColab === 'NOVAS') return 'Propostas novas'
  if (filtroColab === 'N/A') return 'Sem responsavel'
  return filtroColab
}

function descricaoFiltros() {
  const partes = []
  partes.push(`Filtro: ${nomeContextoFiltro()}`)
  if (filtroSearch.trim()) partes.push(`Busca: "${filtroSearch}"`)
  if (filtroDataIni || filtroDataFim) {
    partes.push(`Periodo: ${filtroDataIni ? formatData(filtroDataIni) : 'inicio'} ate ${filtroDataFim ? formatData(filtroDataFim) : 'hoje'}`)
  }
  if (filtroValorMin !== '' || filtroValorMax !== '') {
    partes.push(`Valor: ${filtroValorMin !== '' ? formatValor(Number(filtroValorMin)) : 'R$ 0,00'} ate ${filtroValorMax !== '' ? formatValor(Number(filtroValorMax)) : 'sem limite'}`)
  }
  return partes.join('  |  ')
}

function exportarExcel() {
  const rows = getLinhasVisiveis()
  if (!rows.length) { showToast('Nenhuma proposta para exportar', 'error'); return }

  const dados = rows.map(p => {
    const dias = diasParados(p.na_etapa_desde)
    const ativa = ehAtiva(p.etapa)
    return {
      'Responsável': p.responsavel || 'N/A',
      'Código da Operação': p.codigo || '',
      'Etapa': p.etapa || '',
      'Valor (R$)': valorNum(p),
      'Na Etapa Desde': formatData(p.na_etapa_desde),
      'Dias na Etapa': dias !== null ? dias : '',
      'Situação': ativa ? (dias !== null && dias >= DIAS_LIMITE_PARADA ? 'PARADA' : 'Em tratativa') : 'Finalizada',
      'Observação': p.observacao || '',
    }
  })

  const ws = XLSX.utils.json_to_sheet(dados)
  ws['!cols'] = [ {wch:14},{wch:18},{wch:26},{wch:14},{wch:15},{wch:13},{wch:14},{wch:40} ]

  const wb = XLSX.utils.book_new()
  XLSX.utils.book_append_sheet(wb, ws, 'Propostas')

  // Aba de resumo
  const totalValor = rows.reduce((s,p) => s + valorNum(p), 0)
  const ativas = rows.filter(p => ehAtiva(p.etapa))
  const paradas = ativas.filter(p => { const d = diasParados(p.na_etapa_desde); return d !== null && d >= DIAS_LIMITE_PARADA })
  const resumo = [
    { Indicador: 'Data da exportação', Valor: new Date().toLocaleString('pt-BR') },
    { Indicador: 'Filtro aplicado', Valor: nomeContextoFiltro() },
    { Indicador: 'Total de propostas', Valor: rows.length },
    { Indicador: 'Em tratativa (ativas)', Valor: ativas.length },
    { Indicador: 'Paradas 15+ dias', Valor: paradas.length },
    { Indicador: 'Valor total', Valor: totalValor },
    { Indicador: 'Valor em tratativa', Valor: ativas.reduce((s,p) => s + valorNum(p), 0) },
  ]
  const wsR = XLSX.utils.json_to_sheet(resumo)
  wsR['!cols'] = [ {wch:26},{wch:26} ]
  XLSX.utils.book_append_sheet(wb, wsR, 'Resumo')

  const hoje = new Date().toISOString().split('T')[0]
  const nome = `Microcredito_${nomeContextoFiltro().replace(/[^a-zA-Z0-9]/g,'_')}_${hoje}.xlsx`
  XLSX.writeFile(wb, nome)
  showToast(`✓ ${rows.length} propostas exportadas`)
}

let dadosPainel = { propostas: [], historico: [] }

// O painel começa mostrando só as propostas ativas. O histórico completo
// (que pode ter dezenas de milhares) entra sob demanda, por um botão.
let painelIncluiHistorico = false

async function carregarPainel() {
  const el = document.getElementById('view-painel')
  const oque = painelIncluiHistorico ? 'base completa' : 'propostas ativas'
  el.innerHTML = `<div class="card"><div class="empty"><div class="empty-icon">⏳</div><p>Carregando ${oque}...</p></div></div>`
  try {
    const filtro = painelIncluiHistorico ? '' : '&finalizada=eq.false'
    const [props, hist] = await Promise.all([
      sbAll(`propostas?select=*${filtro}`),
      sb('historico_processamentos?select=*&order=criado_em.desc&limit=12')
    ])
    dadosPainel.propostas = props || []
    dadosPainel.historico = hist || []
    renderPainel()
  } catch(e) {
    el.innerHTML = `<div class="card"><div class="alert alert-danger">❌ Erro ao carregar painel: ${e.message}</div></div>`
  }
}

async function alternarHistoricoPainel() {
  painelIncluiHistorico = !painelIncluiHistorico
  await carregarPainel()
}

function renderPainel() {
  const el = document.getElementById('view-painel')
  if (!dadosPainel.propostas.length) {
    el.innerHTML = `<div class="card"><div class="painel-empty">📭 Nenhuma proposta processada ainda.<br>Processe as planilhas na aba "⚙ Processar" para ver os indicadores.</div></div>`
    return
  }

  const d = calcularDadosPainel()
  const props = d.props
  const totalP = props.length || 1

  // ══ BARRA DE FILTROS DO PAINEL ══
  const colabsDisponiveis = [...new Set(dadosPainel.propostas.map(p => (p.responsavel||'N/A').toUpperCase().trim()))]
    .filter(c => c !== 'N/A').sort()
  const etapasDisponiveis = [...new Set(dadosPainel.propostas.map(p => (p.etapa||'').trim()).filter(Boolean))]
    .sort((a,b) => { const pa=posicaoFunil(a), pb=posicaoFunil(b); if(pa===-1&&pb===-1) return a.localeCompare(b,'pt-BR'); if(pa===-1) return 1; if(pb===-1) return -1; return pa-pb })

  const filtrosPainel = `
    <div class="painel-filtros">
      <select class="fa-input" onchange="painelFiltroColab=this.value; renderPainel()">
        <option value="">👤 Todos os responsáveis</option>
        ${colabsDisponiveis.map(c => `<option value="${c}" ${painelFiltroColab===c?'selected':''}>${c}</option>`).join('')}
      </select>
      <select class="fa-input" onchange="painelFiltroEtapa=this.value; renderPainel()">
        <option value="">📊 Todas as etapas</option>
        ${etapasDisponiveis.map(e => `<option value="${e}" ${painelFiltroEtapa===e?'selected':''}>${e}</option>`).join('')}
      </select>
      <select class="fa-input" onchange="painelFiltroLinha=this.value; renderPainel()">
        <option value="">🏷️ Todas as linhas</option>
        ${LINHAS_CREDITO.map(l => `<option value="${l}" ${painelFiltroLinha===l?'selected':''}>${l}</option>`).join('')}
      </select>
      ${temFiltroPainel() ? `<button class="btn btn-secondary btn-sm" onclick="limparFiltrosPainel()">✕ Limpar</button>` : ''}
    </div>
    <div class="painel-filtros painel-filtros-data">
      <div class="pf-data">
        <span class="pf-data-lbl">📅 Data de Cadastro</span>
        <input type="date" class="fa-input" value="${painelCadIni}" onchange="painelCadIni=this.value; renderPainel()"/>
        <span class="pf-ate">até</span>
        <input type="date" class="fa-input" value="${painelCadFim}" onchange="painelCadFim=this.value; renderPainel()"/>
      </div>
      <div class="pf-data">
        <span class="pf-data-lbl">⏱️ Na Etapa Desde</span>
        <input type="date" class="fa-input" value="${painelEtapaIni}" onchange="painelEtapaIni=this.value; renderPainel()"/>
        <span class="pf-ate">até</span>
        <input type="date" class="fa-input" value="${painelEtapaFim}" onchange="painelEtapaFim=this.value; renderPainel()"/>
      </div>
    </div>`

  // ══ CARDS DE RESUMO ══
  const pctConc = ((d.concedidas.length/totalP)*100).toFixed(1)
  const pctNaoConc = ((d.naoConcedidas.length/totalP)*100).toFixed(1)
  const resumo = `
    <div class="dash-grid">
      <div class="dash-card accent-azul"><div class="dash-label">Total de Propostas</div><div class="dash-value">${props.length}</div></div>
      <div class="dash-card accent-verde"><div class="dash-label">Em Tratativa</div><div class="dash-value">${d.ativas.length}</div><div class="dash-sub">${formatValor(d.valorAtivo)}</div></div>
      <div class="dash-card accent-roxo"><div class="dash-label">Concedidas</div><div class="dash-value">${d.concedidas.length}</div><div class="dash-sub">${formatValor(d.valorConcedido)} · ${pctConc}%</div></div>
      <div class="dash-card accent-vermelho"><div class="dash-label">Recusadas + Excluídas<span class="ajuda ajuda-baixo" data-ajuda="Recusado e Excluído são somados juntos como propostas que não seguiram adiante. O percentual é sobre o total de propostas do filtro.">?</span></div><div class="dash-value">${d.naoConcedidas.length}</div><div class="dash-sub">${formatValor(d.valorNaoConcedido)} · ${pctNaoConc}%</div></div>
      <div class="dash-card accent-parada"><div class="dash-label">⚠️ Paradas 15+ dias<span class="ajuda ajuda-baixo" data-ajuda="Propostas ativas há 15 dias ou mais na mesma etapa. O detalhamento aparece na seção 'Propostas Mais Paradas' abaixo.">?</span></div><div class="dash-value" style="color:${d.paradas.length>0?'#dc2626':'#16a34a'}">${d.paradas.length}</div><div class="dash-sub">precisam de atenção</div></div>
      <div class="dash-card accent-cinza"><div class="dash-label">Média de Dias Parados<span class="ajuda ajuda-baixo ajuda-esq" data-ajuda="Média de dias que as propostas ativas estão paradas na etapa. Quanto menor, mais ágil o andamento.">?</span></div><div class="dash-value">${d.mediaDias}<span style="font-size:14px;font-weight:600;color:#9ca3af"> dias</span></div><div class="dash-sub">média das ativas</div></div>
    </div>`

  // ══ SEÇÃO "ETAPAS" — duas colunas (inteiras à esquerda, extensões à direita) ══
  const corEtapaFunil = (etapa) => {
    const e = (etapa||'').toLowerCase()
    if (e === 'concedido') return '#16a34a'
    if (e === 'excluído' || e === 'excluido') return '#dc2626'
    if (e === 'recusado') return '#d97706'
    return '#3b82f6'
  }

  // Monta uma linha de etapa no estilo FomentoNet (nome à esquerda, barra, % à direita)
  const maxEtapaCol = Math.max(1, ...ETAPAS_INTEIRAS.concat(ETAPAS_EXTENSOES).map(et => (d.etapaMap[et]||{}).count || 0))
  const etapaLinha = (etapa) => {
    const dd = d.etapaMap[etapa] || { count: 0, valor: 0 }
    const pctTotal = totalP ? ((dd.count/totalP)*100).toFixed(2) : '0.00'
    const larguraBarra = maxEtapaCol ? Math.round((dd.count/maxEtapaCol)*100) : 0
    const cor = dd.count > 0 ? corEtapaFunil(etapa) : '#e5e7eb'
    // Cor do badge de %: laranja se for uma das maiores, verde caso contrário
    const badgeCor = dd.count === 0 ? '#9ca3af' : (larguraBarra >= 60 ? '#ea580c' : (larguraBarra >= 25 ? '#eab308' : '#16a34a'))
    return `<div class="etapa-linha">
      <div class="etapa-nome">${etapa} <span class="etapa-qtd">(${dd.count})</span></div>
      <div class="etapa-barra-track">
        <div class="etapa-barra-fill" style="width:${Math.max(larguraBarra,1)}%;background:${cor}"></div>
      </div>
      <div class="etapa-pct" style="background:${badgeCor}">${pctTotal}%</div>
    </div>`
  }

  const etapas = `
    <div class="painel-secao">
      <div class="painel-secao-titulo">📋 Etapas<span class="ajuda ajuda-baixo ajuda-dir" data-ajuda="Todas as etapas oficiais do fluxo. À esquerda as etapas principais (1 a 13), à direita as subetapas de regularização. Mostra quantas propostas há em cada uma e o percentual do total.">?</span></div>
      <div class="painel-secao-sub">Listagem das propostas por etapa — quantidade e percentual sobre o total</div>
      <div class="etapas-colunas">
        <div class="etapas-col">
          <div class="etapas-col-titulo">Etapas principais</div>
          ${ETAPAS_INTEIRAS.map(etapaLinha).join('')}
        </div>
        <div class="etapas-col">
          <div class="etapas-col-titulo">Subetapas / Regularizações</div>
          ${ETAPAS_EXTENSOES.map(etapaLinha).join('')}
        </div>
      </div>
    </div>`

  // ══ SEÇÃO "FUNIL" — cumulativo decrescente, só etapas inteiras (1 a 13) ══
  // Lógica: Fase N = (total de ativas) menos (todas as ativas que estão nas fases 1 até N-1).
  // Ou seja, mostra quantas propostas já passaram por essa fase ou estão à frente dela.
  const ativasTotal = d.ativas.length
  // Conta ativas em cada etapa inteira
  const ativasPorEtapa = {}
  ETAPAS_INTEIRAS.forEach(et => { ativasPorEtapa[et] = 0 })
  d.ativas.forEach(p => {
    const norm = normalizarNomeEtapa(p.etapa)
    if (ativasPorEtapa[norm] !== undefined) ativasPorEtapa[norm]++
  })

  let acumulado = 0
  const funilFases = ETAPAS_INTEIRAS.map((etapa, i) => {
    // Quem chegou nessa fase = total de ativas - as que ficaram nas fases anteriores
    const restante = ativasTotal - acumulado
    acumulado += ativasPorEtapa[etapa]  // soma quem parou nesta fase, para descontar na próxima
    return { etapa, valor: restante, ordem: i+1 }
  })
  const maxFunil = Math.max(1, ...funilFases.map(f => f.valor))

  // Gradiente de cores do funil (topo largo/quente -> base estreita/fria)
  const funilCores = ['#DC2626','#EA580C','#D97706','#CA8A04','#65A30D','#16A34A','#059669','#0D9488','#0891B2','#0284C7','#2563EB','#4F46E5','#7C3AED']
  const funil = `
    <div class="painel-secao">
      <div class="painel-secao-titulo">🔻 Funil<span class="ajuda ajuda-baixo ajuda-dir" data-ajuda="Mostra quantas propostas ativas já passaram por cada fase ou estão à frente dela. A fase 1 tem todas as ativas; cada fase seguinte desconta as que pararam nas anteriores. Vai do maior (fase 1) ao menor (fase 13).">?</span></div>
      <div class="painel-secao-sub">Propostas ativas que já alcançaram cada fase (${ativasTotal} ativas no total)</div>
      <div class="funilv-wrap">
        ${funilFases.map((f, i) => {
          // Largura fielmente proporcional ao valor (valores iguais = largura igual;
          // como a lógica é cumulativa decrescente, nunca fica mais largo que a fase de cima).
          const prop = maxFunil ? (f.valor/maxFunil)*100 : 0
          const larg = f.valor > 0 ? Math.max(prop, 6) : 4
          const pctTotal = ativasTotal ? ((f.valor/ativasTotal)*100).toFixed(1) : '0.0'
          const cor = funilCores[i] || '#7C3AED'
          const corProx = funilCores[i+1] || cor
          const estreito = larg < 12
          return `<div class="funilv-fase">
            <div class="funilv-info-esq">${f.etapa}</div>
            <div class="funilv-barra-area">
              <div class="funilv-trapezio" style="width:${larg}%;--cor:${cor};--cor-prox:${corProx}">
                ${estreito ? '' : `<span class="funilv-valor">${f.valor}</span>`}
              </div>
              ${estreito ? `<span class="funilv-valor-fora" style="color:${cor}">${f.valor}</span>` : ''}
            </div>
            <div class="funilv-info-dir">${pctTotal}%</div>
          </div>`
        }).join('')}
      </div>
    </div>`


  // ══ DISTRIBUIÇÃO POR LINHA DE CRÉDITO ══
  const linhaEntries = Object.entries(d.linhaMap).sort((a,b) => b[1].count - a[1].count)
  const distLinha = linhaEntries.length ? `
    <div class="painel-secao">
      <div class="painel-secao-titulo">🏷️ Distribuição por Linha de Crédito</div>
      <div class="painel-secao-sub">Quantas propostas e o valor de cada linha</div>
      <div class="linha-cards">
        ${linhaEntries.map(([linha, dd]) => {
          const cor = corLinhaCredito(linha === '(sem linha)' ? '' : linha)
          const pct = ((dd.count/totalP)*100).toFixed(1)
          return `<div class="linha-card" style="border-color:${cor}55">
            <div class="linha-card-top" style="background:${cor}12;color:${cor}">${linha}</div>
            <div class="linha-card-num">${dd.count}<span class="linha-card-pct">${pct}%</span></div>
            <div class="linha-card-val">${formatValor(dd.valor)}</div>
          </div>`
        }).join('')}
      </div>
    </div>` : ''

  // ══ CARGA POR RESPONSÁVEL ══
  const cargaOrd = Object.entries(d.cargaMap).filter(([r]) => r !== 'N/A').sort((a,b) => b[1].ativas - a[1].ativas)
  const carga = `
    <div class="painel-secao">
      <div class="painel-secao-titulo">👥 Carga de Trabalho por Responsável<span class="ajuda ajuda-baixo ajuda-dir" data-ajuda="Ordenado pela quantidade de propostas ATIVAS de cada pessoa (não pelo total), para mostrar quem tem mais trabalho em andamento agora.">?</span></div>
      <div class="painel-secao-sub">Ordenado por propostas ativas (em tratativa)</div>
      <div class="carga-grid">
        ${cargaOrd.map(([nome, dd]) => {
          const cor = getCorColab(nome); const fg = getTextColor(cor)
          return `<div class="carga-card" style="--cor-colab:${cor}">
            <span class="carga-avatar" style="background:${cor};color:${fg}">${getIniciais(nome)}</span>
            <div class="carga-info">
              <div class="carga-nome">${nome}</div>
              <div class="carga-nums"><span><b>${dd.ativas}</b> ativas</span><span style="color:#9ca3af">de ${dd.total} total</span></div>
              <div class="carga-valor">${formatValor(dd.valorAtivo)}</div>
              ${dd.paradas > 0 ? `<span class="carga-alerta">⚠️ ${dd.paradas} parada${dd.paradas>1?'s':''}</span>` : ''}
            </div>
          </div>`
        }).join('')}
      </div>
    </div>`

  // ══ RANKING DE PARADAS — com observação ══
  const rankParadas = d.rankParadas.slice(0, 15)
  const ranking = `
    <div class="painel-secao">
      <div class="painel-secao-titulo">⏱️ Propostas Mais Paradas</div>
      <div class="painel-secao-sub">Top ${rankParadas.length} propostas ativas há mais tempo na mesma etapa (15+ dias)</div>
      ${rankParadas.length === 0
        ? `<div class="painel-empty">✅ Nenhuma proposta parada há mais de ${DIAS_LIMITE_PARADA} dias. Tudo em dia!</div>`
        : `<table class="rank-table">
            <thead><tr><th>#</th><th>Responsável</th><th>Código</th><th>Etapa</th><th>Valor</th><th>Parada há</th><th>Observação</th></tr></thead>
            <tbody>
              ${rankParadas.map((p, i) => {
                const cor = getCorColab(p.responsavel || 'N/A'); const fg = getTextColor(cor)
                const obs = (p.observacao || '').trim()
                return `<tr>
                  <td class="rank-pos">${i+1}</td>
                  <td><span class="resp-avatar" style="background:${cor};color:${fg};width:24px;height:24px;font-size:9px">${getIniciais(p.responsavel||'N/A')}</span> <span style="font-size:12px;font-weight:600">${p.responsavel||'N/A'}</span></td>
                  <td style="font-family:'IBM Plex Mono',monospace;font-weight:700">${p.codigo}</td>
                  <td>${etapaBadge(p.etapa)}</td>
                  <td style="font-family:'IBM Plex Mono',monospace;font-size:11.5px">${formatValor(p.valor)}</td>
                  <td class="rank-dias"><span class="rank-dias-badge">${p.dias} dias</span></td>
                  <td style="font-size:11.5px;color:${obs?'#374151':'#cbd5e1'};max-width:220px">${obs || '—'}</td>
                </tr>`
              }).join('')}
            </tbody>
          </table>`
      }
    </div>`

  // ══ EVOLUÇÃO — propostas novas por dia (5 dias antes do último processamento) ══
  const evolucao = renderEvolucao()

  el.innerHTML = `
    <div class="card">
      <div class="dash-header">
        <div class="dash-title">📊 Painel Gerencial</div>
        <div style="display:flex;gap:6px;align-items:center">
          <button class="btn btn-secondary btn-sm" onclick="exportarPainelExcel()" title="Exportar indicadores para Excel">📊 Excel</button>
          <button class="btn btn-secondary btn-sm" onclick="exportarPainelPDF()" title="Exportar relatório gerencial em PDF">📄 Relatório PDF</button>
          <button class="btn btn-secondary btn-sm" onclick="alternarHistoricoPainel()" title="Alterna entre ver só as propostas ativas ou toda a base histórica">${painelIncluiHistorico ? '📂 Base completa' : '📁 Só ativas'}</button>
          <button class="btn btn-secondary btn-sm" onclick="carregarPainel()">↺ Atualizar</button>
        </div>
      </div>
      ${filtrosPainel}
      ${resumo}
    </div>
    ${etapas}
    ${funil}
    ${distLinha}
    ${carga}
    ${ranking}
    ${evolucao}`
}

// Evolução: conta propostas por data de "Na Etapa Desde" nos 5 dias anteriores ao último processamento
function renderEvolucao() {
  const props = dadosPainel.propostas
  // Data de referência: último processamento (ou hoje)
  let dataRef = new Date()
  if (dadosPainel.historico.length) {
    const ult = dadosPainel.historico[0].criado_em
    if (ult) dataRef = new Date(ult)
  }
  dataRef.setHours(0,0,0,0)

  // Monta os últimos 5 dias
  const dias = []
  for (let i = 4; i >= 0; i--) {
    const d = new Date(dataRef)
    d.setDate(d.getDate() - i)
    const iso = d.toISOString().split('T')[0]
    dias.push({ iso, label: d.toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'}), count: 0, valor: 0 })
  }

  // Conta propostas cuja na_etapa_desde cai em cada dia
  props.forEach(p => {
    if (!p.na_etapa_desde) return
    const dt = String(p.na_etapa_desde).split('T')[0]
    const dia = dias.find(x => x.iso === dt)
    if (dia) { dia.count++; dia.valor += valorNum(p) }
  })

  const totalPeriodo = dias.reduce((s,d) => s + d.count, 0)
  const mediaPeriodo = Math.round(totalPeriodo / 5)
  const maxDia = Math.max(1, ...dias.map(d => d.count))

  return `
    <div class="painel-secao">
      <div class="painel-secao-titulo">📈 Propostas Novas por Dia<span class="ajuda ajuda-baixo ajuda-dir" data-ajuda="Conta quantas propostas foram criadas em cada um dos 5 dias anteriores ao ultimo processamento, com base na data Na Etapa Desde.">?</span></div>
      <div class="painel-secao-sub">Propostas criadas nos 5 dias anteriores ao último processamento (${dataRef.toLocaleDateString('pt-BR')})</div>
      <div class="evo-resumo">
        <div class="evo-resumo-item"><span class="evo-resumo-num">${totalPeriodo}</span><span class="evo-resumo-lbl">no período (5 dias)</span></div>
        <div class="evo-resumo-item"><span class="evo-resumo-num">${mediaPeriodo}</span><span class="evo-resumo-lbl">média por dia</span></div>
      </div>
      <div class="evo-wrap">
        ${dias.map(d => {
          const altura = Math.max((d.count/maxDia)*100, 2)
          return `<div class="evo-col">
            <div class="evo-val">${d.count}</div>
            <div class="evo-bar" style="height:${altura}%" title="${d.count} propostas · ${formatValor(d.valor)} em ${d.label}"></div>
            <div class="evo-data">${d.label}</div>
          </div>`
        }).join('')}
      </div>
    </div>`
}

// ── Exportação do Painel Gerencial ──
// Filtros próprios do Painel Gerencial
let painelFiltroColab = ''
let painelFiltroEtapa = ''
let painelFiltroLinha = ''
// Filtros de data do painel (aceitam início e fim, ambos opcionais)
let painelCadIni = '', painelCadFim = ''      // Data de Cadastro
let painelEtapaIni = '', painelEtapaFim = ''  // Na Etapa Desde

function propostasPainelFiltradas() {
  let props = [...dadosPainel.propostas]
  if (painelFiltroColab) props = props.filter(p => (p.responsavel||'N/A').toUpperCase().trim() === painelFiltroColab)
  if (painelFiltroEtapa) props = props.filter(p => (p.etapa||'').trim() === painelFiltroEtapa)
  if (painelFiltroLinha) props = props.filter(p => normalizarLinhaCredito(p.linha_credito) === painelFiltroLinha)

  // Filtros por período. Propostas sem a data preenchida ficam de fora
  // quando o filtro correspondente está ativo.
  const soData = v => v ? String(v).split('T')[0] : ''
  if (painelCadIni)   props = props.filter(p => soData(p.data_cadastro)  && soData(p.data_cadastro)  >= painelCadIni)
  if (painelCadFim)   props = props.filter(p => soData(p.data_cadastro)  && soData(p.data_cadastro)  <= painelCadFim)
  if (painelEtapaIni) props = props.filter(p => soData(p.na_etapa_desde) && soData(p.na_etapa_desde) >= painelEtapaIni)
  if (painelEtapaFim) props = props.filter(p => soData(p.na_etapa_desde) && soData(p.na_etapa_desde) <= painelEtapaFim)

  return props
}

function temFiltroPainel() {
  return !!(painelFiltroColab || painelFiltroEtapa || painelFiltroLinha ||
            painelCadIni || painelCadFim || painelEtapaIni || painelEtapaFim)
}

function limparFiltrosPainel() {
  painelFiltroColab = ''; painelFiltroEtapa = ''; painelFiltroLinha = ''
  painelCadIni = ''; painelCadFim = ''; painelEtapaIni = ''; painelEtapaFim = ''
  renderPainel()
}

function calcularDadosPainel() {
  const props = propostasPainelFiltradas()
  const ativas = props.filter(p => ehAtiva(p.etapa))
  const paradas = ativas.filter(p => { const d = diasParados(p.na_etapa_desde); return d !== null && d >= DIAS_LIMITE_PARADA })
  const concedidas = props.filter(p => (p.etapa||'').toLowerCase().trim() === 'concedido')
  // Recusado + Excluído somados (100% juntos)
  const naoConcedidas = props.filter(p => {
    const e = (p.etapa||'').toLowerCase().trim()
    return e === 'recusado' || e === 'excluído' || e === 'excluido'
  })

  // Média de dias parados (ativas com data válida)
  const diasArr = ativas.map(p => diasParados(p.na_etapa_desde)).filter(d => d !== null)
  const mediaDias = diasArr.length ? Math.round(diasArr.reduce((s,d) => s+d, 0) / diasArr.length) : 0

  // Distribuição por etapa (com valor)
  const etapaMap = {}
  props.forEach(p => {
    const bruto = (p.etapa||'—').trim() || '—'
    // Normaliza para o nome oficial (ex: "Análise Cadastral" -> "4 - Análise Cadastral")
    const e = posicaoFunil(bruto) !== -1 ? normalizarNomeEtapa(bruto) : bruto
    if (!etapaMap[e]) etapaMap[e] = { count: 0, valor: 0 }
    etapaMap[e].count++
    etapaMap[e].valor += valorNum(p)
  })

  // Carga por responsável
  const cargaMap = {}
  props.forEach(p => {
    const r = (p.responsavel || 'N/A').toUpperCase().trim()
    if (!cargaMap[r]) cargaMap[r] = { total: 0, ativas: 0, paradas: 0, valorAtivo: 0, valorTotal: 0, concedidas: 0 }
    cargaMap[r].total++
    cargaMap[r].valorTotal += valorNum(p)
    if ((p.etapa||'').toLowerCase().trim() === 'concedido') cargaMap[r].concedidas++
    if (ehAtiva(p.etapa)) {
      cargaMap[r].ativas++
      cargaMap[r].valorAtivo += valorNum(p)
      const d = diasParados(p.na_etapa_desde)
      if (d !== null && d >= DIAS_LIMITE_PARADA) cargaMap[r].paradas++
    }
  })

  const rankParadas = ativas
    .map(p => ({ ...p, dias: diasParados(p.na_etapa_desde) }))
    .filter(p => p.dias !== null && p.dias >= DIAS_LIMITE_PARADA)
    .sort((a,b) => b.dias - a.dias)

  // Distribuição por linha de crédito
  const linhaMap = {}
  props.forEach(p => {
    const l = normalizarLinhaCredito(p.linha_credito) || '(sem linha)'
    if (!linhaMap[l]) linhaMap[l] = { count: 0, valor: 0 }
    linhaMap[l].count++
    linhaMap[l].valor += valorNum(p)
  })

  return {
    props, ativas, paradas, concedidas, naoConcedidas, etapaMap, cargaMap, rankParadas, linhaMap, mediaDias,
    valorTotal: props.reduce((s,p) => s + valorNum(p), 0),
    valorAtivo: ativas.reduce((s,p) => s + valorNum(p), 0),
    valorConcedido: concedidas.reduce((s,p) => s + valorNum(p), 0),
    valorNaoConcedido: naoConcedidas.reduce((s,p) => s + valorNum(p), 0),
    semResp: props.filter(p => !p.responsavel || p.responsavel === 'N/A').length,
  }
}

function exportarPainelExcel() {
  if (!dadosPainel.propostas.length) { showToast('Nenhum dado para exportar', 'error'); return }
  const d = calcularDadosPainel()
  const wb = XLSX.utils.book_new()

  // Aba 1 — Resumo Executivo
  const resumo = [
    { Indicador: 'Data do relatório', Valor: new Date().toLocaleString('pt-BR') },
    { Indicador: 'Total de propostas', Valor: d.props.length },
    { Indicador: 'Em tratativa (ativas)', Valor: d.ativas.length },
    { Indicador: 'Concedidas', Valor: d.concedidas.length },
    { Indicador: 'Recusadas + Excluídas', Valor: d.naoConcedidas.length },
    { Indicador: 'Paradas 15+ dias', Valor: d.paradas.length },
    { Indicador: 'Média de dias parados', Valor: d.mediaDias },
    { Indicador: 'Valor total', Valor: d.valorTotal },
    { Indicador: 'Valor em tratativa', Valor: d.valorAtivo },
    { Indicador: 'Valor concedido', Valor: d.valorConcedido },
    { Indicador: 'Valor recusado + excluído', Valor: d.valorNaoConcedido },
  ]
  const wsR = XLSX.utils.json_to_sheet(resumo)
  wsR['!cols'] = [{wch:26},{wch:24}]
  XLSX.utils.book_append_sheet(wb, wsR, 'Resumo Executivo')

  // Aba 2 — Funil por Etapa
  const funil = Object.entries(d.etapaMap)
    .sort((a,b) => b[1].count - a[1].count)
    .map(([etapa, v]) => ({
      'Etapa': etapa,
      'Quantidade': v.count,
      '% do Total': ((v.count/d.props.length)*100).toFixed(1) + '%',
      'Valor Acumulado (R$)': v.valor,
    }))
  const wsF = XLSX.utils.json_to_sheet(funil)
  wsF['!cols'] = [{wch:30},{wch:12},{wch:12},{wch:20}]
  XLSX.utils.book_append_sheet(wb, wsF, 'Funil por Etapa')

  // Aba 3 — Carga por Responsável
  const carga = Object.entries(d.cargaMap)
    .filter(([r]) => r !== 'N/A')
    .sort((a,b) => b[1].ativas - a[1].ativas)
    .map(([nome, v]) => ({
      'Responsável': nome,
      'Total de Propostas': v.total,
      'Em Tratativa': v.ativas,
      'Concedidas': v.concedidas,
      'Paradas 15+ dias': v.paradas,
      'Valor em Tratativa (R$)': v.valorAtivo,
      'Valor Total (R$)': v.valorTotal,
    }))
  const wsC = XLSX.utils.json_to_sheet(carga)
  wsC['!cols'] = [{wch:14},{wch:18},{wch:13},{wch:12},{wch:16},{wch:20},{wch:18}]
  XLSX.utils.book_append_sheet(wb, wsC, 'Carga por Responsável')

  // Aba 4 — Propostas Paradas
  if (d.rankParadas.length) {
    const rank = d.rankParadas.map((p,i) => ({
      '#': i+1,
      'Responsável': p.responsavel || 'N/A',
      'Código da Operação': p.codigo,
      'Etapa': p.etapa,
      'Valor (R$)': valorNum(p),
      'Na Etapa Desde': formatData(p.na_etapa_desde),
      'Dias Parada': p.dias,
    }))
    const wsP = XLSX.utils.json_to_sheet(rank)
    wsP['!cols'] = [{wch:5},{wch:14},{wch:18},{wch:26},{wch:14},{wch:15},{wch:12}]
    XLSX.utils.book_append_sheet(wb, wsP, 'Propostas Paradas')
  }

  // Aba 5 — Histórico
  if (dadosPainel.historico.length) {
    const hist = dadosPainel.historico.map(h => ({
      'Data': new Date(h.criado_em).toLocaleString('pt-BR'),
      'Total de Propostas': h.total_propostas || 0,
      'Arquivos': (h.arquivos_enviados || []).join(', '),
    }))
    const wsH = XLSX.utils.json_to_sheet(hist)
    wsH['!cols'] = [{wch:20},{wch:18},{wch:50}]
    XLSX.utils.book_append_sheet(wb, wsH, 'Histórico')
  }

  const hoje = new Date().toISOString().split('T')[0]
  XLSX.writeFile(wb, `Painel_Gerencial_Microcredito_${hoje}.xlsx`)
  showToast('✓ Relatório gerencial exportado')
}

function renderHistorico() {
  document.getElementById('view-historico').innerHTML = `
  <div class="card">
    <div class="card-title">🕒 Histórico de Processamentos</div>
    <div id="lista-historico"><div class="empty"><div class="empty-icon">⏳</div><p>Carregando...</p></div></div>
  </div>`
}

async function carregarHistorico() {
  try {
    const data = await sb('historico_processamentos?select=*&order=criado_em.desc&limit=50')
    const lista = data || []
    if (!lista.length) {
      document.getElementById('lista-historico').innerHTML = `<div class="empty"><div class="empty-icon">📭</div><p>Nenhum processamento realizado ainda.</p></div>`
      return
    }
    document.getElementById('lista-historico').innerHTML = lista.map(h => {
      const dt = new Date(h.criado_em)
      const dataFmt = dt.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric'})
      const horaFmt = dt.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'})
      const arqs = (h.arquivos_enviados || []).join(', ')
      return `<div class="hist-item">
        <div class="hist-icon">📊</div>
        <div class="hist-info">
          <div class="hist-data">${dataFmt} às ${horaFmt}</div>
          <div class="hist-detalhe">${arqs || 'Arquivos não registrados'}</div>
        </div>
        <span class="hist-badge">${h.total_propostas || 0} propostas</span>
      </div>`
    }).join('')
  } catch(e) {
    document.getElementById('lista-historico').innerHTML = `<div class="alert alert-danger">❌ Erro: ${e.message}</div>`
  }
}
